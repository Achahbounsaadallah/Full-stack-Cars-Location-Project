# HTTP : redirection vers HTTPS
server {
    listen 80;
    server_name nova-drive.ooguy.com;

    # Nécessaire pour le renouvellement Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS : application Cars Location
server {
    listen 443 ssl;
    server_name nova-drive.ooguy.com;

    ssl_certificate /etc/letsencrypt/live/nova-drive.ooguy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nova-drive.ooguy.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
